<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=300"/>
<title>AF 300x250</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121110;--panel:#1e1b18;--line:#3a342e;--ink:#ede8dc;--dim:#8a806f;--amber:#e8a33d;--cyan:#56cdbd;--display:'Chakra Petch',sans-serif;--mono:'IBM Plex Mono',monospace;--body:'Archivo',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:300px;height:250px;background:var(--bg);color:var(--ink);overflow:hidden}
.wrap{width:300px;height:250px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line)}
.top{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--dim);display:flex;justify-content:space-between}
.top b{color:var(--ink)}
h1{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.02;margin-top:8px}
h1 .a{color:var(--amber)} h1 .c{color:var(--cyan)}
.sub{color:var(--dim);font-size:11px;line-height:1.5;margin-top:6px}
.sub strong{color:var(--ink)}
.mini{margin-top:8px;background:var(--panel);border:1px solid #2e2923;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.mini span{font-family:var(--mono);font-size:9px;letter-spacing:.08em}
.mini .you{color:var(--amber)} .mini .agent{color:var(--cyan)}
.cta{margin-top:10px;background:var(--amber);color:#201a10;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;padding:9px 14px;border-radius:6px;text-align:center;text-decoration:none;display:block}
.foot{font-family:var(--mono);font-size:8px;color:var(--dim);text-align:center;letter-spacing:.06em;margin-top:6px}
</style></head><body>
<div class="wrap">
  <div>
    <div class="top"><span><b>AGENTFLOW</b></span><span>19 WEBMCP TOOLS</span></div>
    <h1>One canvas.<br><span class="a">You</span> wire it.<br><span class="c">Your agent</span> drives it.</h1>
    <p class="sub">Drag 15 modules or prompt <strong>add_node → run</strong> — same wires.</p>
    <div class="mini"><span class="you">◉ YOU — drag · wire · RUN</span><span class="agent">◉ AGENT — tools</span></div>
  </div>
  <div>
    <a class="cta" href="https://agentflow-hackathon.pages.dev">Go to the tool →</a>
    <div class="foot">agentflow-hackathon.pages.dev · No signup</div>
  </div>
</div>
</body></html>
