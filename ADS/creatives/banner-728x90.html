<!doctype html><html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=728"/>
<title>AF 728x90</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121110;--panel:#1e1b18;--line:#3a342e;--ink:#ede8dc;--dim:#8a806f;--amber:#e8a33d;--cyan:#56cdbd;--display:'Chakra Petch',sans-serif;--mono:'IBM Plex Mono',monospace;--body:'Archivo',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:728px;height:90px;background:var(--bg);color:var(--ink);overflow:hidden}
.wrap{width:728px;height:90px;display:grid;grid-template-columns:1fr auto;align-items:center;border:1px solid var(--line);padding:14px 20px;gap:16px}
.left{display:flex;align-items:center;gap:16px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.10em;font-size:11px;display:flex;align-items:center;gap:8px}
.brand i{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px var(--amber)}
h1{font-family:var(--display);font-weight:700;font-size:18px;line-height:1}
h1 .a{color:var(--amber)} h1 .c{color:var(--cyan)}
.sub{font-size:11px;color:var(--dim)}
.cta{background:var(--amber);color:#201a10;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:10px 18px;border-radius:6px;text-decoration:none;white-space:nowrap}
.meta{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.06em;margin-top:4px}
</style></head><body>
<div class="wrap">
  <div class="left">
    <div>
      <div class="brand"><i></i> AGENTFLOW</div>
      <h1>One canvas. <span class="a">You</span> + <span class="c">agent</span>.</h1>
      <div class="meta">15 modules · 19 WebMCP tools · No signup</div>
    </div>
    <div style="width:1px;height:56px;background:var(--line)"></div>
    <div>
      <div class="sub">Drag, wire, <b style="color:var(--ink)">RUN</b> — or prompt <b style="color:var(--cyan)">add_node → run</b>.</div>
      <div class="meta">Amber is you · Cyan is your agent · Same wires</div>
    </div>
  </div>
  <a class="cta" href="https://agentflow-hackathon.pages.dev">Go to the tool →</a>
</div>
</body></html>
